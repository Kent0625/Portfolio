<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Kent John Macalam profile portrait">
  <defs>
    <radialGradient id="halo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="200" cy="200" r="180" fill="url(#halo)"/>

  <!-- Futuristic Orbit Ring -->
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>

  <!-- Shoulders / Torso -->
  <path d="M70 380 C80 290 120 260 200 260 C280 260 320 290 330 380 Z" fill="url(#bodyGrad)"/>
  <path d="M125 380 L165 295 L200 340 L235 295 L275 380 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M165 295 L200 340 L235 295 L200 280 Z" fill="url(#accentGrad)" opacity="0.85"/>

  <!-- Neck -->
  <path d="M174 235 H226 V285 C226 295 214 300 200 300 C186 300 174 295 174 285 Z" fill="#94a3b8"/>

  <!-- Head -->
  <ellipse cx="200" cy="170" rx="72" ry="85" fill="url(#skinGrad)"/>

  <!-- Modern Hair -->
  <path d="M128 170 C125 110 160 85 200 85 C245 85 275 110 272 170 C265 125 240 100 200 100 C155 100 135 130 128 170 Z" fill="#090d16"/>
  <path d="M140 115 C160 90 220 85 260 110 C240 98 180 95 140 115 Z" fill="url(#accentGrad)" opacity="0.7"/>

  <!-- Stylish Glasses -->
  <rect x="150" y="152" width="40" height="26" rx="6" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <rect x="210" y="152" width="40" height="26" rx="6" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <line x1="190" y1="163" x2="210" y2="163" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <line x1="135" y1="160" x2="150" y2="160" stroke="url(#accentGrad)" stroke-width="2"/>
  <line x1="250" y1="160" x2="265" y2="160" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Glass reflections -->
  <line x1="156" y1="172" x2="178" y2="156" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  <line x1="216" y1="172" x2="238" y2="156" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

  <!-- Smile & subtle details -->
  <path d="M185 215 Q200 225 215 215" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
</svg>
