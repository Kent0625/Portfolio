<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTripCDO — Itinerary Planner Funnel</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(22, 30, 49, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #0ea5e9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .funnel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(14, 165, 233, 0.2);
      color: #7dd3fc;
      margin-bottom: 16px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    input, select {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .success-msg { display: none; margin-top: 16px; color: #38bdf8; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="funnel-card">
    <div class="badge">GenAI Funnel</div>
    <h1>Curated Cagayan de Oro Guide</h1>
    <p>Generate a customized, hallucination-free travel schedule for your Northern Mindanao visit.</p>

    <form onsubmit="handleSubmit(event)">
      <select>
        <option>Weekend Getaway (1–2 Days)</option>
        <option>Adventure &amp; River Canyoning (3 Days)</option>
        <option>Cultural &amp; Food Journey (4+ Days)</option>
      </select>
      <input type="text" placeholder="Travel Party Size (e.g. 2 adults)" required>
      <input type="email" placeholder="Your Email for Itinerary PDF" required>
      <button type="submit" class="btn">Generate Custom Plan</button>
    </form>
    <div class="success-msg" id="msg">✓ Itinerary synthesized from 47 local points of interest!</div>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      document.getElementById('msg').style.display = 'block';
    }
  </script>
</body>
</html>
