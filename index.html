<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kent John U. Macalam — Data Science &amp; Machine Learning Portfolio</title>
    <meta
      name="description"
      content="Data Science, Machine Learning, Dashboards, and AI projects by Kent John U. Macalam. Turning raw datasets into explainable models and decision-ready insights."
    />
    <meta name="author" content="Kent John U. Macalam" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#07090e" />
    <link rel="canonical" href="https://kent-macalam-portfolio.onrender.com/" />

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload avatar above fold -->
    <link rel="preload" as="image" href="/avatar.svg" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kent John U. Macalam" />
    <meta property="og:title" content="Kent John U. Macalam — Data Science &amp; Machine Learning Portfolio" />
    <meta
      property="og:description"
      content="Data Science, Machine Learning, Dashboards, and AI projects by Kent John U. Macalam."
    />
    <meta property="og:url" content="https://kent-macalam-portfolio.onrender.com/" />
    <meta property="og:image" content="/assets/projects/legislative-ml-pubmat.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kent John U. Macalam — Data Science Portfolio" />
    <meta name="twitter:description" content="Machine learning, analytics, dashboards, statistics, and AI projects." />
    <meta name="twitter:image" content="/assets/projects/legislative-ml-pubmat.png" />

    <!-- Theme before first paint -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
          document.documentElement.style.colorScheme = document.documentElement.dataset.theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', document.documentElement.dataset.theme === 'dark' ? '#070B14' : '#F4F4ED');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
